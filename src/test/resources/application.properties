spring.datasource.url=jdbc:h2:mem:careerconnect;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=test-only-secret-that-is-at-least-32-characters-long
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173
spring.flyway.enabled=false
app.storage.resumes=${java.io.tmpdir}/careerconnect/resumes-test
