server.port=18080
spring.datasource.url=jdbc:h2:mem:careerconnect-fullstack-e2e;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=full-stack-e2e-only-secret-key-at-least-32-characters
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://127.0.0.1:4174
app.storage.resumes=${java.io.tmpdir}/careerconnect/fullstack-e2e-resumes
