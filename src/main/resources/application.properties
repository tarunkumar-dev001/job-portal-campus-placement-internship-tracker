spring.application.name=demo
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.storage.resumes=${RESUME_STORAGE_PATH}
app.security.require-email-verification=true
app.mailjet.api-key=${MAILJET_API_KEY:}
app.mailjet.api-secret=${MAILJET_API_SECRET:}
app.mail.sender.address=${MAIL_FROM_ADDRESS:}
app.mail.sender.name=${MAIL_FROM_NAME:}
app.mail.frontend.verification-url=${FRONTEND_VERIFICATION_URL:}
app.mail.frontend.reset-url=${FRONTEND_PASSWORD_RESET_URL:}
